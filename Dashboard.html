YPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Zeal Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
      color: whitesmoke;
      padding: 40px 60px;
    }

    .center-title {
      font-family: 'Great Vibes', cursive;
      color: goldenrod;
      text-align: center;
      font-size: 4.5rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 12px rgba(218, 165, 32, 0.35);
    }

    .center-subtitle {
      text-align: center;
      color: whitesmoke;
      font-weight: bold;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    .divider {
      width: 220px;
      height: 2px;
      background: linear-gradient(to right, transparent, goldenrod, transparent);
      margin: 25px auto 40px auto;
      border: none;
    }

    .left-block {
      text-align: left;
    }

    .greeting {
      color: whitesmoke;
      font-size: 1.6rem;
      font-weight: 600;
    }

    .welcome {
      color: royalblue;
      font-size: 1.2rem;
      margin-top: 6px;
    }

    .scripture-heading {
      text-align: center;
      color: whitesmoke;
      font-size: 1.3rem;
      margin-top: 50px;
      letter-spacing: 2px;
    }

    .verse-ref {
      text-align: left;
      color: royalblue;
      font-size: 1.3rem;
      margin-top: 30px;
    }

    .closing {
      text-align: center;
      color: whitesmoke;
      font-size: 1.4rem;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <h1 class="center-title">Daily Zeal</h1>
  <p class="center-subtitle">Stay rooted in God at the center</p>

  <hr class="divider">

  <div class="left-block">
    <h3 class="greeting">Good morning</h3>
    <h3 class="welcome">Welcome to your daily scripture</h3>
  </div>

  <h3 class="scripture-heading">Scripture</h3>

  <h4 class="verse-ref">Hosea 4:6- My people are destroyed for lack of knowledge...</h4>

  <h3 class="closing">Spend time in God's word today</h3>

</body>
</html>
